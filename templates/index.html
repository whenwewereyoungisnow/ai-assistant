<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>

    <!-- marked.js renders markdown to HTML. highlight.js adds syntax coloring
         to code blocks. DOMPurify sanitizes the HTML so rendered markdown can't
         inject malicious scripts (XSS protection). All loaded from CDN as
         allowed by the project rules. -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* CSS variables for theming — change these to restyle the whole app.
           Using variables means colors are defined once and reused everywhere,
           so switching to light mode later is just changing these values. */
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --bg-input: #1a1a3e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a80;
            --accent: #4a9eff;
            --accent-hover: #3a8eef;
            --border: #2a2a4a;
            --user-bubble: #1e3a5f;
            --assistant-bubble: #1e1e3a;
            --badge-bg: #2a2a4a;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
            --sidebar-width: 280px;
        }

        /* Light theme — overrides the dark CSS variables when
           data-theme="light" is set on <html>. All components use
           var() references, so swapping the theme is instant. */
        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e4e8ed;
            --bg-input: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8a8aa0;
            --accent: #2a7de1;
            --accent-hover: #1a6dd1;
            --border: #d0d4da;
            --user-bubble: #e8f0fe;
            --assistant-bubble: #f0f0f8;
            --badge-bg: #e4e8ed;
            --danger: #d32f2f;
            --success: #2e7d32;
            --warning: #ed6c02;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: var(--accent-hover);
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .conversation-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: background 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .conversation-item:hover {
            background: var(--bg-tertiary);
        }

        .conversation-item.active {
            background: var(--bg-tertiary);
        }

        .conversation-item-info {
            overflow: hidden;
            flex: 1;
            min-width: 0;
        }

        .conversation-title {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .conversation-mode-badge {
            font-size: 10px;
            color: var(--accent);
            margin-top: 1px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s;
        }

        .conversation-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: var(--danger);
        }

        /* --- Main area --- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-width: 0;
        }

        /* Mode selector bar at the top */
        .mode-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .mode-btn {
            padding: 6px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
        }

        .mode-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .mode-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .mode-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* --- Document panel (shown in documents mode) --- */
        .doc-panel {
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            padding: 12px 20px;
            display: none;
        }

        .doc-panel.visible {
            display: block;
        }

        .doc-panel-inner {
            max-width: 780px;
            margin: 0 auto;
        }

        /* Drag-and-drop upload zone */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            margin-bottom: 10px;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(74, 158, 255, 0.05);
        }

        .upload-zone-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        .upload-zone-text strong {
            color: var(--accent);
        }

        .upload-progress {
            font-size: 12px;
            color: var(--accent);
            margin-top: 6px;
        }

        /* Uploaded document list */
        .doc-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .doc-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 12px;
        }

        .doc-item-name {
            color: var(--text-primary);
            font-weight: 500;
        }

        .doc-item-stats {
            color: var(--text-muted);
        }

        .doc-item-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 0 2px;
        }

        .doc-item-delete:hover {
            color: var(--danger);
        }

        /* --- Sources section in messages --- */
        .sources-section {
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            max-width: 780px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .sources-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(74, 158, 255, 0.08);
            cursor: pointer;
            font-size: 12px;
            color: var(--accent);
            border: none;
            width: 100%;
            text-align: left;
        }

        .sources-header:hover {
            background: rgba(74, 158, 255, 0.12);
        }

        .sources-body {
            display: none;
            padding: 8px;
            gap: 6px;
            flex-direction: column;
        }

        .sources-body.open {
            display: flex;
        }

        .source-card {
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 12px;
        }

        .source-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .source-card-file {
            color: var(--accent);
            font-weight: 500;
        }

        .source-card-page {
            color: var(--text-muted);
        }

        .source-card-score {
            color: var(--success);
            margin-left: auto;
        }

        .source-card-text {
            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
        }

        .source-card-text.expanded {
            display: block;
            -webkit-line-clamp: unset;
        }

        /* Searching indicator shown before sources arrive */
        .searching-indicator {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 16px;
            color: var(--accent);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .searching-indicator .dot-pulse {
            display: inline-flex;
            gap: 4px;
        }

        .searching-indicator .dot-pulse span {
            width: 5px;
            height: 5px;
            background: var(--accent);
            border-radius: 50%;
            animation: dotPulse 1.2s infinite;
        }

        .searching-indicator .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
        .searching-indicator .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* --- Messages area --- */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--text-muted);
            text-align: center;
            gap: 12px;
        }

        .welcome h2 {
            font-size: 24px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .welcome p {
            font-size: 14px;
            max-width: 400px;
        }

        .message {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .message-role {
            font-weight: 600;
            text-transform: capitalize;
        }

        .message-role.user {
            color: var(--accent);
        }

        .message-role.assistant {
            color: var(--success);
        }

        /* Routing badge shows which model answered and why. */
        .routing-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 8px;
            background: var(--badge-bg);
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .routing-badge .model-name {
            color: var(--accent);
            font-weight: 500;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
        }

        .message.user .message-content {
            background: var(--user-bubble);
            border: 1px solid var(--border);
        }

        .message.assistant .message-content {
            background: var(--assistant-bubble);
            border: 1px solid var(--border);
        }

        /* Markdown content styling */
        .message-content p { margin-bottom: 8px; }
        .message-content p:last-child { margin-bottom: 0; }

        .message-content pre {
            background: #0d1117;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 8px 0;
            border: 1px solid var(--border);
        }

        .message-content code {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
        }

        .message-content :not(pre) > code {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .message-content ul, .message-content ol { margin: 8px 0; padding-left: 24px; }
        .message-content li { margin-bottom: 4px; }

        .message-content blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            color: var(--text-secondary);
            margin: 8px 0;
        }

        .message-content h1, .message-content h2, .message-content h3 { margin: 12px 0 8px 0; }

        .message-content table { border-collapse: collapse; margin: 8px 0; width: 100%; }
        .message-content th, .message-content td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
        .message-content th { background: rgba(255, 255, 255, 0.05); }
        .message-content a { color: var(--accent); }

        /* Thinking blocks from deepseek-r1 */
        .thinking-block { margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }

        .thinking-toggle {
            display: flex; align-items: center; gap: 6px; padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03); cursor: pointer; font-size: 12px;
            color: var(--text-muted); width: 100%; border: none; text-align: left;
        }

        .thinking-toggle:hover { background: rgba(255, 255, 255, 0.06); }

        .thinking-content {
            padding: 8px 12px; font-size: 13px; color: var(--text-secondary);
            border-top: 1px solid var(--border); display: none; white-space: pre-wrap;
        }

        .thinking-content.open { display: block; }

        /* Timing info shown after response completes */
        .timing-info {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            padding-left: 16px;
        }

        /* --- Input area --- */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .input-wrapper {
            max-width: 780px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper textarea {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 200px;
            outline: none;
            transition: border-color 0.15s;
        }

        .input-wrapper textarea:focus { border-color: var(--accent); }

        .send-btn {
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            height: 44px;
        }

        .send-btn:hover { background: var(--accent-hover); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- Streaming indicator --- */
        .streaming-indicator {
            display: inline-block;
            width: 6px;
            height: 14px;
            background: var(--accent);
            border-radius: 2px;
            animation: blink 0.8s infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* --- Writing pipeline ---
           The pipeline renders each phase (draft, critique, revision) as a
           collapsible section. Phases stack vertically inside .writing-pipeline.
           Each phase has a clickable header (showing phase name, model, timing)
           and a content area that collapses when the next phase starts. */

        .writing-pipeline {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .writing-phase {
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: var(--assistant-bubble);
        }

        .writing-phase-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--badge-bg);
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            text-align: left;
            font-family: inherit;
        }

        .writing-phase-header:hover {
            background: var(--bg-tertiary);
        }

        .writing-phase-header .arrow {
            font-size: 10px;
            color: var(--text-muted);
            width: 12px;
            flex-shrink: 0;
        }

        .writing-phase-header .phase-label {
            font-weight: 600;
        }

        .phase-label.draft { color: var(--accent); }
        .phase-label.revision { color: var(--success); }
        .phase-label.critique { color: var(--warning); }

        .writing-phase-header .model-name {
            color: var(--text-muted);
            font-size: 11px;
        }

        .writing-phase-timing {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 11px;
            flex-shrink: 0;
        }

        .writing-phase-content {
            padding: 12px 16px;
            line-height: 1.6;
            font-size: 14px;
        }

        .writing-phase-content.collapsed {
            display: none;
        }

        .writing-stop-btn {
            align-self: flex-start;
            padding: 6px 16px;
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: background 0.2s;
            margin-top: 4px;
        }

        .writing-stop-btn:hover {
            background: var(--danger);
            color: white;
        }

        .writing-summary {
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 0;
            border-top: 1px solid var(--border);
            margin-top: 4px;
        }

        /* --- Status bar at the bottom of the main area ---
           Shows loaded models, document counts, and GPU memory.
           Polled from /status every 12 seconds. */
        .status-bar {
            padding: 4px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .status-bar .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-bar .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
        }

        /* --- Document consultation banner ---
           Shown in chat mode when documents are auto-consulted, and in
           writing mode when documents inform the draft. Clickable to
           expand/collapse source details. */
        .doc-consulted-banner {
            max-width: 780px;
            width: 100%;
            margin: 0 auto 8px;
            padding: 8px 12px;
            background: rgba(74, 158, 255, 0.08);
            border: 1px solid rgba(74, 158, 255, 0.15);
            border-radius: 8px;
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
        }

        .doc-consulted-banner:hover {
            background: rgba(74, 158, 255, 0.12);
        }

        .doc-consulted-banner .banner-header {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .doc-consulted-banner .banner-details {
            display: none;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(74, 158, 255, 0.1);
        }

        .doc-consulted-banner .banner-details.open {
            display: block;
        }

        .doc-consulted-banner .source-ref {
            font-size: 11px;
            color: var(--text-secondary);
            margin: 2px 0;
        }

        /* --- Toast (enhanced with types) --- */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show { opacity: 1; pointer-events: auto; }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        .toast.success { border-color: var(--success); color: var(--success); }

        /* --- Settings panel --- */
        .settings-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .settings-overlay.open { display: flex; }

        .settings-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 480px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
        }

        .settings-panel h3 {
            margin-bottom: 16px;
            font-size: 18px;
        }

        .settings-group {
            margin-bottom: 16px;
        }

        .settings-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .settings-group select,
        .settings-group input[type="range"] {
            width: 100%;
            padding: 6px 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
        }

        .settings-group select { appearance: none; cursor: pointer; }

        .settings-group .range-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-group .range-value {
            font-size: 14px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .settings-row label {
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 0;
        }

        /* Toggle switch for theme */
        .toggle {
            width: 44px; height: 24px;
            background: var(--border);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
        }
        .toggle.active { background: var(--accent); }
        .toggle::after {
            content: '';
            position: absolute;
            width: 18px; height: 18px;
            background: white;
            border-radius: 50%;
            top: 3px; left: 3px;
            transition: transform 0.2s;
        }
        .toggle.active::after { transform: translateX(20px); }

        .settings-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .settings-actions button {
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }

        .settings-actions .save-btn {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* --- Search overlay (Cmd+K) --- */
        .search-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: flex-start;
            padding-top: 15vh;
        }
        .search-overlay.open { display: flex; }

        .search-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 500px;
            max-width: 90vw;
            overflow: hidden;
        }

        .search-panel input {
            width: 100%;
            padding: 14px 16px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        .search-results {
            max-height: 300px;
            overflow-y: auto;
        }

        .search-result {
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.1s;
        }

        .search-result:hover { background: var(--bg-tertiary); }

        .search-result-title {
            font-size: 13px;
            font-weight: 500;
        }

        .search-result-snippet {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .search-empty {
            padding: 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* --- Gear icon + export icon in header --- */
        .mode-bar-actions {
            margin-left: auto;
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            width: 32px; height: 32px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .icon-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }

        /* --- Skeleton loading --- */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--border) 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }
        .skeleton-line { height: 14px; margin-bottom: 8px; }
        .skeleton-line:last-child { width: 60%; }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* --- Animations --- */
        .mode-btn { transition: all 0.2s ease; }
        .sidebar { transition: transform 0.3s ease; }
        .doc-panel { transition: all 0.2s ease; }

        /* --- Mobile responsive --- */
        .mobile-toggle {
            display: none;
            width: 36px; height: 36px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            border-radius: 6px;
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 50;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                z-index: 60;
                transform: translateX(-100%);
            }
            .sidebar.mobile-open { transform: translateX(0); }
            .sidebar-backdrop.open { display: block; }
            .mobile-toggle { display: flex; align-items: center; justify-content: center; }
            .mode-bar { flex-wrap: wrap; gap: 4px; padding: 8px 12px; }
            .mode-btn { padding: 5px 10px; font-size: 12px; }
            .input-wrapper { padding: 0; }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

    <!-- Sidebar: conversation list -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
        </div>
        <div class="conversation-list" id="conversationList"></div>
    </div>
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

    <!-- Main chat area -->
    <div class="main">
        <div class="mode-bar">
            <button class="mobile-toggle" onclick="toggleSidebar()">&#9776;</button>
            <button class="mode-btn active" data-mode="chat">&#x1F4AC; Chat</button>
            <button class="mode-btn" data-mode="documents">&#x1F4C4; Docs</button>
            <button class="mode-btn" data-mode="writing">&#x270D;&#xFE0F; Write</button>
            <button class="mode-btn disabled" data-mode="vision">&#x1F441; Vision</button>
            <div class="mode-bar-actions">
                <button class="icon-btn" onclick="openSettings()" title="Settings (Cmd+,)">&#x2699;</button>
            </div>
        </div>

        <!-- Document panel — shown only in documents mode.
             Contains the upload area and list of uploaded documents. -->
        <div class="doc-panel" id="docPanel">
            <div class="doc-panel-inner">
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-zone-text">
                        <strong>Drop a PDF here</strong> or click to upload
                    </div>
                    <div class="upload-progress" id="uploadProgress"></div>
                    <input type="file" id="fileInput" accept=".pdf" style="display: none">
                </div>
                <div class="doc-list" id="docList"></div>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="welcome" id="welcome">
                <h2>AI Assistant</h2>
                <p id="welcomeText">Ask me anything. I'll route your question to the best model automatically.</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput"
                          placeholder="Type a message..."
                          rows="1"
                          onkeydown="handleKeydown(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            <span class="status-item"><span class="status-dot"></span> Connecting...</span>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Settings panel overlay -->
    <div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
        <div class="settings-panel">
            <h3>Settings</h3>
            <div class="settings-group">
                <label>General Model</label>
                <select id="set-general_model"></select>
            </div>
            <div class="settings-group">
                <label>Code Model</label>
                <select id="set-code_model"></select>
            </div>
            <div class="settings-group">
                <label>Reasoning Model</label>
                <select id="set-reasoning_model"></select>
            </div>
            <div class="settings-group">
                <label>RAG / Document Model</label>
                <select id="set-rag_model"></select>
            </div>
            <div class="settings-group">
                <label>Writer Model</label>
                <select id="set-writer_model"></select>
            </div>
            <div class="settings-group">
                <label>Editor Model</label>
                <select id="set-editor_model"></select>
            </div>
            <div class="settings-group">
                <label>Search Method</label>
                <select id="set-search_method">
                    <option value="semantic">Semantic</option>
                    <option value="keyword">Keyword (BM25)</option>
                    <option value="hybrid">Hybrid</option>
                </select>
            </div>
            <div class="settings-group">
                <label>Search Results</label>
                <div class="range-row">
                    <input type="range" id="set-search_results_count" min="1" max="10" value="5"
                           oninput="this.nextElementSibling.textContent=this.value">
                    <span class="range-value">5</span>
                </div>
            </div>
            <div class="settings-group">
                <label>Writing Rounds</label>
                <div class="range-row">
                    <input type="range" id="set-max_writing_rounds" min="1" max="5" value="3"
                           oninput="this.nextElementSibling.textContent=this.value">
                    <span class="range-value">3</span>
                </div>
            </div>
            <div class="settings-group">
                <label>Theme</label>
                <select id="set-theme">
                    <option value="system">System (sync with OS)</option>
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>
            <div class="settings-actions">
                <button onclick="closeSettings()">Cancel</button>
                <button class="save-btn" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <!-- Search overlay (Cmd+K) -->
    <div class="search-overlay" id="searchOverlay" onclick="if(event.target===this)closeSearch()">
        <div class="search-panel">
            <input type="text" id="searchInput" placeholder="Search conversations..." oninput="debounceSearch(this.value)">
            <div class="search-results" id="searchResults">
                <div class="search-empty">Type to search across all conversations</div>
            </div>
        </div>
    </div>

    <script>
        // =========================================================
        // State
        // =========================================================
        let currentConversationId = null;
        let currentMode = 'chat';
        let isStreaming = false;

        // Writing pipeline state — tracked separately because the pipeline
        // creates multiple content sections (one per phase) unlike chat/documents
        // which have a single assistant message per response.
        let writingAbortController = null;
        let pipelineContainer = null;
        let currentPhaseDiv = null;

        // Configure marked.js for markdown rendering.
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
        });

        // =========================================================
        // System status polling
        // =========================================================
        // Fetches /status every 12 seconds to show loaded models,
        // document counts, and GPU memory in the bottom status bar.

        async function pollStatus() {
            try {
                const res = await fetch('/status');
                if (!res.ok) return;
                const data = await res.json();

                // Shorten model names for display (e.g. "qwen3.5:35b..." → "qwen3.5")
                const modelNames = data.models.length > 0
                    ? data.models.map(m => m.split(':')[0]).join(', ')
                    : 'none loaded';

                const bar = document.getElementById('statusBar');
                bar.innerHTML = `
                    <span class="status-item">
                        <span class="status-dot"></span>
                        Models: ${escapeHtml(modelNames)}
                    </span>
                    <span class="status-item">Docs: ${data.documents} (${data.chunks} chunks)</span>
                    <span class="status-item">GPU: ${data.gpu_vram_gb} GB</span>
                `;
            } catch (e) {
                // Status polling is non-critical — silently ignore errors
                // (e.g. if Ollama is restarting or the server is briefly down)
            }
        }

        pollStatus();
        setInterval(pollStatus, 12000);

        // =========================================================
        // Mode switching
        // =========================================================

        const WELCOME_MESSAGES = {
            chat: "Ask me anything. I'll route your question to the best model automatically.",
            documents: "Upload PDFs and ask questions about them. I'll search your documents and cite sources.",
            writing: "Describe what you'd like written. A writer and editor will collaborate through multiple rounds to refine the result.",
        };

        function switchMode(mode) {
            if (mode === currentMode) return;
            // Block mode switching while a response is streaming — otherwise
            // the SSE reader keeps writing to removed DOM elements.
            if (isStreaming) {
                showToast('Please wait for the current response to finish.');
                return;
            }
            currentMode = mode;

            // Update mode buttons
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.mode-btn[data-mode="${mode}"]`).classList.add('active');

            // Show/hide document panel
            document.getElementById('docPanel').classList.toggle('visible', mode === 'documents');

            // Update placeholder text
            const placeholders = {
                documents: 'Ask about your documents...',
                writing: 'Describe what you\'d like written...',
            };
            document.getElementById('userInput').placeholder =
                placeholders[mode] || 'Type a message...';

            // Reset conversation and reload sidebar for this mode
            currentConversationId = null;
            clearMessages();
            loadConversations();

            // Load document list when switching to documents mode
            if (mode === 'documents') {
                loadDocuments();
            }
        }

        // =========================================================
        // Conversations
        // =========================================================

        async function loadConversations() {
            // Show skeleton while loading
            const list = document.getElementById('conversationList');
            if (!list.children.length || list.querySelector('.skeleton')) {
                list.innerHTML = Array(3).fill(
                    '<div style="padding:10px 12px"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line" style="width:40%"></div></div>'
                ).join('');
            }
            const res = await fetch('/conversations');
            const conversations = await res.json();
            renderConversationList(conversations);
        }

        function renderConversationList(conversations) {
            const list = document.getElementById('conversationList');
            // Filter to only show conversations for the current mode
            const filtered = conversations.filter(c => c.mode === currentMode);

            if (filtered.length === 0) {
                list.innerHTML = '<div style="padding: 16px; color: var(--text-muted); font-size: 13px; text-align: center;">No conversations yet</div>';
                return;
            }

            const modeIcons = { chat: '\u{1F4AC}', documents: '\u{1F4C4}', writing: '\u270D\uFE0F', vision: '\u{1F441}' };
            list.innerHTML = filtered.map(c => `
                <div class="conversation-item ${c.id === currentConversationId ? 'active' : ''}"
                     onclick="loadConversation('${c.id}')">
                    <div class="conversation-item-info">
                        <div class="conversation-title">${modeIcons[c.mode] || ''} ${escapeHtml(c.title)}</div>
                        <div class="conversation-time">${timeAgo(c.updated_at)}</div>
                    </div>
                    <button class="delete-btn" onclick="event.stopPropagation(); exportConversation('${c.id}')" title="Export" style="font-size:12px">&#x2B07;</button>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteConversation('${c.id}')" title="Delete">&#x2715;</button>
                </div>
            `).join('');
        }

        async function newChat() {
            const res = await fetch('/conversations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode: currentMode }),
            });
            const data = await res.json();
            currentConversationId = data.id;
            clearMessages();
            await loadConversations();
        }

        async function loadConversation(id) {
            currentConversationId = id;
            const res = await fetch(`/conversations/${id}`);
            const conversation = await res.json();

            // Sync mode to match the loaded conversation so the UI stays
            // consistent (e.g. document panel visibility, sidebar filtering).
            if (conversation.mode && conversation.mode !== currentMode) {
                currentMode = conversation.mode;
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                document.querySelector(`.mode-btn[data-mode="${conversation.mode}"]`).classList.add('active');
                document.getElementById('docPanel').classList.toggle('visible', conversation.mode === 'documents');
                if (conversation.mode === 'documents') loadDocuments();
            }

            renderMessages(conversation.messages);
            await loadConversations();
        }

        async function deleteConversation(id) {
            await fetch(`/conversations/${id}`, { method: 'DELETE' });
            if (currentConversationId === id) {
                currentConversationId = null;
                clearMessages();
            }
            await loadConversations();
        }

        // =========================================================
        // Documents management
        // =========================================================

        async function loadDocuments() {
            const res = await fetch('/documents');
            const docs = await res.json();
            renderDocumentList(docs);
        }

        function renderDocumentList(docs) {
            const list = document.getElementById('docList');
            if (docs.length === 0) {
                list.innerHTML = '';
                return;
            }
            list.innerHTML = docs.map(d => `
                <div class="doc-item">
                    <span class="doc-item-name">${escapeHtml(d.filename)}</span>
                    <span class="doc-item-stats">${d.pages} pages, ${d.chunks} chunks</span>
                    <button class="doc-item-delete" onclick="deleteDocument('${escapeHtml(d.filename).replace(/'/g, "\\'")}')" title="Remove">&#x2715;</button>
                </div>
            `).join('');
        }

        async function uploadDocument(file) {
            const progress = document.getElementById('uploadProgress');
            progress.textContent = `Processing ${file.name}...`;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/documents/upload', {
                    method: 'POST',
                    body: formData,
                });

                if (!res.ok) {
                    const err = await res.json();
                    showToast(err.detail || 'Upload failed');
                    progress.textContent = '';
                    return;
                }

                const result = await res.json();
                const replacedMsg = result.replaced ? ' (replaced)' : '';
                progress.textContent = `${result.filename}: ${result.pages} pages, ${result.chunks} chunks${replacedMsg}`;
                setTimeout(() => { progress.textContent = ''; }, 3000);

                await loadDocuments();
                pollStatus();
            } catch (err) {
                showToast('Upload error: ' + err.message);
                progress.textContent = '';
            }
        }

        async function deleteDocument(filename) {
            await fetch(`/documents/${encodeURIComponent(filename)}`, { method: 'DELETE' });
            await loadDocuments();
            pollStatus();
        }

        // --- Upload zone event handlers ---

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');

        uploadZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadDocument(e.target.files[0]);
                fileInput.value = '';
            }
        });

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                uploadDocument(e.dataTransfer.files[0]);
            }
        });

        // =========================================================
        // Messages
        // =========================================================

        function clearMessages() {
            const welcomeText = WELCOME_MESSAGES[currentMode] || WELCOME_MESSAGES.chat;
            document.getElementById('messages').innerHTML = `
                <div class="welcome" id="welcome">
                    <h2>AI Assistant</h2>
                    <p id="welcomeText">${welcomeText}</p>
                </div>`;
        }

        function renderMessages(messages) {
            const container = document.getElementById('messages');
            container.innerHTML = '';

            // Group consecutive pipeline messages so they render as a single
            // collapsible pipeline display instead of separate messages.
            let i = 0;
            while (i < messages.length) {
                const msg = messages[i];

                // Check if this starts a pipeline group (writing mode)
                if (msg.role === 'assistant' && msg.metadata && msg.metadata.pipeline) {
                    const pipelineMsgs = [];
                    while (i < messages.length && messages[i].role === 'assistant' &&
                           messages[i].metadata && messages[i].metadata.pipeline) {
                        pipelineMsgs.push(messages[i]);
                        i++;
                    }
                    // Find the user message right before the pipeline to show it
                    renderPipelineMessages(pipelineMsgs, container);
                    continue;
                }

                // For assistant messages that auto-consulted documents in chat/writing
                // mode, show the consultation banner above the response.
                if (msg.role === 'assistant' && msg.metadata && msg.metadata.doc_consulted && msg.metadata.doc_consulted.length > 0) {
                    container.appendChild(createDocConsultedBanner(msg.metadata.doc_consulted));
                }

                // For assistant messages with sources metadata, render sources
                // section above the response. This handles both live streaming
                // and reloading saved conversations from the database.
                if (msg.role === 'assistant' && msg.metadata && msg.metadata.sources && msg.metadata.sources.length > 0) {
                    container.appendChild(createSourcesElement(msg.metadata.sources));
                }
                const el = createMessageElement(msg.role, msg.content, msg.metadata);
                container.appendChild(el);
                i++;
            }

            scrollToBottom();
        }

        function createMessageElement(role, content, metadata) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            // Build header with role label and optional routing badge
            let headerHtml = `<span class="message-role ${role}">${role}</span>`;

            if (role === 'assistant' && metadata) {
                // Show routing badge for chat mode (has "reason"), or model badge for documents
                if (metadata.reason) {
                    headerHtml += `
                        <span class="routing-badge">
                            <span class="model-name">${escapeHtml(metadata.model || '')}</span>
                            <span>${escapeHtml(metadata.reason || '')}</span>
                        </span>`;
                } else if (metadata.model) {
                    headerHtml += `
                        <span class="routing-badge">
                            <span class="model-name">${escapeHtml(metadata.model || '')}</span>
                            <span>document Q&A</span>
                        </span>`;
                }
            }

            div.innerHTML = `
                <div class="message-header">${headerHtml}</div>
                <div class="message-content">${renderMarkdown(content)}</div>
            `;

            // Add timing info if available
            if (role === 'assistant' && metadata && metadata.total_ms) {
                const timing = document.createElement('div');
                timing.className = 'timing-info';
                const parts = [`${(metadata.total_ms / 1000).toFixed(1)}s total`];
                if (metadata.stream_ms) parts.push(`${(metadata.stream_ms / 1000).toFixed(1)}s generation`);
                if (metadata.classify_ms) parts.push(`routed in ${metadata.classify_ms}ms`);
                timing.textContent = parts.join(' \u00b7 ');
                div.appendChild(timing);
            }

            return div;
        }

        /**
         * Create a document consultation banner for reloaded conversations.
         * Used when a chat or writing response was informed by uploaded documents.
         * The banner is clickable to show/hide source details.
         */
        function createDocConsultedBanner(sources, message) {
            const banner = document.createElement('div');
            banner.className = 'doc-consulted-banner';
            const label = message || 'Answer informed by uploaded documents';

            const detailsHtml = sources.map(s =>
                `<div class="source-ref">${escapeHtml(s.filename)}, page ${escapeHtml(String(s.page))} — ${Math.round((s.score || 0) * 100)}% match</div>`
            ).join('');

            banner.innerHTML = `
                <div class="banner-header">
                    \u{1F4C4} ${escapeHtml(label)}
                    <span style="margin-left: auto; font-size: 10px; color: var(--text-muted);">\u25B6 details</span>
                </div>
                <div class="banner-details">${detailsHtml}</div>
            `;

            banner.addEventListener('click', () => {
                const details = banner.querySelector('.banner-details');
                details.classList.toggle('open');
                const arrow = banner.querySelector('.banner-header span:last-child');
                arrow.textContent = details.classList.contains('open') ? '\u25BC details' : '\u25B6 details';
            });

            return banner;
        }

        /**
         * Create a collapsible sources section to show which document chunks
         * were found. Used both during live streaming (when the "sources" SSE
         * event arrives) and when reloading saved conversations from the database.
         */
        function createSourcesElement(sources) {
            const section = document.createElement('div');
            section.className = 'sources-section';

            const id = 'src-' + Math.random().toString(36).substring(2, 9);

            // Build source cards HTML
            const cardsHtml = sources.map(s => `
                <div class="source-card">
                    <div class="source-card-header">
                        <span class="source-card-file">${escapeHtml(s.filename)}</span>
                        <span class="source-card-page">page ${s.page}</span>
                        <span class="source-card-score">${(s.score * 100).toFixed(0)}% match</span>
                    </div>
                    <div class="source-card-text" onclick="this.classList.toggle('expanded')">${escapeHtml(s.text)}</div>
                </div>
            `).join('');

            // We build this HTML ourselves (not from model output), so no XSS risk.
            // Using onclick for the toggle — same DOMPurify bypass pattern as <think> blocks.
            section.innerHTML = `
                <button class="sources-header" onclick="document.getElementById('${id}').classList.toggle('open'); this.querySelector('.arrow').textContent = document.getElementById('${id}').classList.contains('open') ? '\u25BC' : '\u25B6'">
                    <span class="arrow">\u25B6</span> ${sources.length} sources found
                </button>
                <div class="sources-body" id="${id}">
                    ${cardsHtml}
                </div>
            `;

            return section;
        }

        /**
         * Render markdown content safely.
         * marked.js converts markdown -> HTML, then DOMPurify strips any
         * dangerous tags/attributes (XSS protection).
         *
         * We also handle deepseek-r1's <think>...</think> blocks here,
         * converting them into collapsible sections.
         */
        function renderMarkdown(text) {
            if (!text) return '';

            // Extract <think> blocks BEFORE markdown + sanitization.
            const thinkBlocks = [];
            text = text.replace(/<think>([\s\S]*?)<\/think>/g, (match, thinkContent) => {
                const id = 'think-' + Math.random().toString(36).substring(2, 9);
                thinkBlocks.push({ id, content: thinkContent.trim() });
                return `%%THINK_${thinkBlocks.length - 1}%%`;
            });

            let html = DOMPurify.sanitize(marked.parse(text));

            // Re-insert thinking blocks after sanitization.
            thinkBlocks.forEach((block, i) => {
                html = html.replace(`%%THINK_${i}%%`, `
                    <div class="thinking-block">
                        <button class="thinking-toggle" onclick="document.getElementById('${block.id}').classList.toggle('open'); this.querySelector('.arrow').textContent = document.getElementById('${block.id}').classList.contains('open') ? '\u25BC' : '\u25B6'">
                            <span class="arrow">\u25B6</span> Reasoning
                        </button>
                        <div class="thinking-content" id="${block.id}">${escapeHtml(block.content)}</div>
                    </div>
                `);
            });

            return html;
        }

        // =========================================================
        // Writing pipeline helpers
        // =========================================================

        /**
         * Create a collapsible phase section for the writing pipeline.
         * Each phase (draft, critique, revision) gets its own section with
         * a clickable header showing the phase name, model, and timing.
         * Clicking the header toggles the content visibility.
         */
        function createWritingPhaseElement(data) {
            const phaseKey = data.phase + '-' + data.round;
            const section = document.createElement('div');
            section.className = 'writing-phase';
            section.dataset.phase = phaseKey;

            const labels = {
                draft: 'Draft',
                critique: 'Editor Critique',
                revision: 'Revision (Round ' + data.round + ')',
            };
            const label = labels[data.phase] || data.phase;
            const phaseClass = data.phase;  // draft, critique, or revision

            section.innerHTML =
                '<button class="writing-phase-header" onclick="togglePhase(this)">' +
                    '<span class="arrow">\u25BC</span>' +
                    '<span class="phase-label ' + phaseClass + '">' + escapeHtml(label) + '</span>' +
                    '<span class="model-name">' + escapeHtml(data.model) + '</span>' +
                    '<span class="writing-phase-timing"></span>' +
                '</button>' +
                '<div class="writing-phase-content">' +
                    '<span class="streaming-indicator"></span>' +
                '</div>';

            return section;
        }

        function togglePhase(btn) {
            const content = btn.nextElementSibling;
            const isCollapsed = content.classList.toggle('collapsed');
            btn.querySelector('.arrow').textContent = isCollapsed ? '\u25B6' : '\u25BC';
        }

        /**
         * Render saved pipeline messages when reloading a conversation.
         * Groups consecutive messages with metadata.pipeline === true into
         * a static pipeline display with collapsible phases.
         */
        function renderPipelineMessages(pipelineMessages, container) {
            const wrapper = document.createElement('div');
            wrapper.className = 'writing-pipeline';

            for (let i = 0; i < pipelineMessages.length; i++) {
                const msg = pipelineMessages[i];
                const meta = msg.metadata || {};
                const isLast = i === pipelineMessages.length - 1;

                const phaseEl = createWritingPhaseElement({
                    phase: meta.phase || 'draft',
                    round: meta.round || 1,
                    model: meta.model || '',
                });

                // Set timing
                const timingSpan = phaseEl.querySelector('.writing-phase-timing');
                if (meta.duration_ms) {
                    timingSpan.textContent = (meta.duration_ms / 1000).toFixed(1) + 's';
                }

                // Fill content
                const contentDiv = phaseEl.querySelector('.writing-phase-content');
                contentDiv.innerHTML = renderMarkdown(msg.content);
                contentDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));

                // Collapse all phases except the last one so the user sees
                // the final result by default but can expand earlier phases
                if (!isLast) {
                    contentDiv.classList.add('collapsed');
                    phaseEl.querySelector('.arrow').textContent = '\u25B6';
                }

                wrapper.appendChild(phaseEl);
            }

            container.appendChild(wrapper);
        }

        // =========================================================
        // Sending messages + SSE streaming
        // =========================================================

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text || isStreaming) return;

            // Auto-create a conversation if none is selected
            if (!currentConversationId) {
                const res = await fetch('/conversations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: currentMode }),
                });
                const data = await res.json();
                currentConversationId = data.id;
                await loadConversations();
            }

            // Clear the welcome message if it's still showing
            const welcome = document.querySelector('.welcome');
            if (welcome) welcome.remove();

            // Add user message to UI
            const messagesContainer = document.getElementById('messages');
            const userEl = createMessageElement('user', text, null);
            messagesContainer.appendChild(userEl);

            input.value = '';
            input.style.height = 'auto';
            scrollToBottom();

            // In documents mode, show a "Searching documents..." indicator
            // while the backend searches for relevant chunks.
            let searchingEl = null;
            if (currentMode === 'documents') {
                searchingEl = document.createElement('div');
                searchingEl.className = 'searching-indicator';
                searchingEl.innerHTML = 'Searching documents... <span class="dot-pulse"><span></span><span></span><span></span></span>';
                messagesContainer.appendChild(searchingEl);
                scrollToBottom();
            }

            // Start streaming the response.
            isStreaming = true;
            document.getElementById('sendBtn').disabled = true;

            // Writing mode uses an AbortController so the Stop button can
            // cancel the pipeline mid-stream. Other modes don't need this
            // since they produce a single response.
            if (currentMode === 'writing') {
                writingAbortController = new AbortController();
            }

            try {
                const fetchOptions = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                };
                if (writingAbortController) {
                    fetchOptions.signal = writingAbortController.signal;
                }
                const res = await fetch(`/chat/${currentConversationId}`, fetchOptions);

                if (!res.ok) {
                    const err = await res.json();
                    showToast(err.detail || err.error || 'Something went wrong');
                    if (searchingEl) searchingEl.remove();
                    return;
                }

                // Parse the SSE stream manually.
                const reader = res.body.getReader();
                const decoder = new TextDecoder();

                let assistantDiv = null;
                let contentDiv = null;
                let fullContent = '';
                let metadata = {};
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    // Normalize \r\n to \n so the split below works consistently.
                    buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');

                    const parts = buffer.split('\n\n');
                    buffer = parts.pop();

                    for (const part of parts) {
                        if (!part.trim()) continue;
                        if (part.trim().startsWith(':')) continue;

                        let eventType = 'message';
                        const dataLines = [];

                        for (const line of part.split('\n')) {
                            if (line.startsWith('event:')) {
                                eventType = line.substring(6).trim();
                            } else if (line.startsWith('data:')) {
                                dataLines.push(line.substring(5).trim());
                            }
                        }

                        const eventData = dataLines.join('\n');
                        if (!eventData) continue;

                        let parsed;
                        try {
                            parsed = JSON.parse(eventData);
                        } catch {
                            continue;
                        }

                        // --- Chat mode: routing event ---
                        if (eventType === 'routing') {
                            metadata = parsed;
                            assistantDiv = document.createElement('div');
                            assistantDiv.className = 'message assistant';

                            assistantDiv.innerHTML = `
                                <div class="message-header">
                                    <span class="message-role assistant">assistant</span>
                                    <span class="routing-badge">
                                        <span class="model-name">${escapeHtml(parsed.model)}</span>
                                        <span>${escapeHtml(parsed.reason)}</span>
                                    </span>
                                </div>
                                <div class="message-content"><span class="streaming-indicator"></span></div>
                            `;

                            contentDiv = assistantDiv.querySelector('.message-content');
                            messagesContainer.appendChild(assistantDiv);
                            scrollToBottom();
                        }

                        // --- Cross-mode: document consultation indicator ---
                        // When chat or writing mode auto-detects relevant uploaded
                        // documents, the backend sends a "doc_consulted" event.
                        // We show a subtle banner that the user can click to see
                        // which documents influenced the response.
                        else if (eventType === 'doc_consulted') {
                            const sources = parsed.sources || [];
                            const banner = createDocConsultedBanner(sources, parsed.message);
                            messagesContainer.appendChild(banner);
                            scrollToBottom();
                        }

                        // --- Documents mode: sources event ---
                        // The backend sends the search results before streaming tokens.
                        // We display them in a collapsible section so the user sees
                        // what was found while the model generates its answer.
                        else if (eventType === 'sources') {
                            if (searchingEl) {
                                searchingEl.remove();
                                searchingEl = null;
                            }

                            const sources = parsed.sources || [];
                            const ragModel = parsed.model || 'document Q&A';
                            metadata = { sources, model: ragModel };

                            // Show sources section
                            if (sources.length > 0) {
                                messagesContainer.appendChild(createSourcesElement(sources));
                            }

                            // Create assistant message div for the streamed response
                            assistantDiv = document.createElement('div');
                            assistantDiv.className = 'message assistant';
                            assistantDiv.innerHTML = `
                                <div class="message-header">
                                    <span class="message-role assistant">assistant</span>
                                    <span class="routing-badge">
                                        <span class="model-name">${escapeHtml(ragModel)}</span>
                                        <span>document Q&A</span>
                                    </span>
                                </div>
                                <div class="message-content"><span class="streaming-indicator"></span></div>
                            `;

                            contentDiv = assistantDiv.querySelector('.message-content');
                            messagesContainer.appendChild(assistantDiv);
                            scrollToBottom();
                        }

                        // --- Writing mode: phase events ---
                        // The pipeline sends "writing" events for phase_start
                        // and phase_end. Each phase gets its own collapsible
                        // section in the UI.
                        else if (eventType === 'writing') {
                            if (parsed.type === 'phase_start') {
                                // Create the pipeline container on first phase
                                if (!pipelineContainer) {
                                    pipelineContainer = document.createElement('div');
                                    pipelineContainer.className = 'writing-pipeline';

                                    const stopBtn = document.createElement('button');
                                    stopBtn.className = 'writing-stop-btn';
                                    stopBtn.textContent = 'Stop Pipeline';
                                    stopBtn.onclick = () => {
                                        if (writingAbortController) writingAbortController.abort();
                                    };
                                    pipelineContainer.appendChild(stopBtn);
                                    messagesContainer.appendChild(pipelineContainer);
                                }

                                // Collapse the previous phase (if any) so the
                                // user focuses on the current one
                                if (currentPhaseDiv) {
                                    const prevContent = currentPhaseDiv.querySelector('.writing-phase-content');
                                    if (prevContent) {
                                        prevContent.innerHTML = renderMarkdown(fullContent);
                                        prevContent.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                                        prevContent.classList.add('collapsed');
                                        currentPhaseDiv.querySelector('.arrow').textContent = '\u25B6';
                                    }
                                }

                                // Create new phase section
                                const phaseEl = createWritingPhaseElement(parsed);

                                // Insert before the stop button
                                const stopBtn = pipelineContainer.querySelector('.writing-stop-btn');
                                pipelineContainer.insertBefore(phaseEl, stopBtn);
                                currentPhaseDiv = phaseEl;
                                contentDiv = phaseEl.querySelector('.writing-phase-content');
                                fullContent = '';
                                scrollToBottom();
                            }

                            else if (parsed.type === 'phase_end') {
                                // Update timing in the phase header
                                if (currentPhaseDiv) {
                                    const timingSpan = currentPhaseDiv.querySelector('.writing-phase-timing');
                                    if (timingSpan && parsed.duration_ms) {
                                        timingSpan.textContent = (parsed.duration_ms / 1000).toFixed(1) + 's';
                                    }
                                }
                                // Finalize content (remove streaming indicator)
                                if (contentDiv) {
                                    contentDiv.innerHTML = renderMarkdown(fullContent);
                                    contentDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                                }
                            }
                        }

                        // --- Shared: token event ---
                        else if (eventType === 'token') {
                            fullContent += parsed.content;
                            if (contentDiv) {
                                contentDiv.innerHTML = renderMarkdown(fullContent) +
                                    '<span class="streaming-indicator"></span>';
                                scrollToBottom();
                            }
                        }

                        // --- Shared: done event ---
                        else if (eventType === 'done') {
                            // Remove searching indicator if still showing
                            if (searchingEl) {
                                searchingEl.remove();
                                searchingEl = null;
                            }

                            // Writing mode: finalize the pipeline display
                            if (currentMode === 'writing' && pipelineContainer) {
                                // Finalize the last phase content
                                if (contentDiv) {
                                    contentDiv.innerHTML = renderMarkdown(fullContent);
                                    contentDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                                }

                                // Remove stop button
                                const stopBtn = pipelineContainer.querySelector('.writing-stop-btn');
                                if (stopBtn) stopBtn.remove();

                                // Add summary bar
                                const summary = document.createElement('div');
                                summary.className = 'writing-summary';
                                const approvedText = parsed.approved ? 'Editor approved' : 'Max rounds reached';
                                summary.textContent = parsed.rounds + ' round(s) \u00b7 ' +
                                    (parsed.total_ms / 1000).toFixed(1) + 's total \u00b7 ' + approvedText;
                                pipelineContainer.appendChild(summary);

                                // Reset pipeline state
                                pipelineContainer = null;
                                currentPhaseDiv = null;
                            } else {
                                // Chat / Documents mode: finalize single response
                                if (contentDiv) {
                                    contentDiv.innerHTML = renderMarkdown(fullContent);
                                    contentDiv.querySelectorAll('pre code').forEach(block => {
                                        hljs.highlightElement(block);
                                    });
                                }

                                // Add timing info
                                if (assistantDiv && parsed.total_ms) {
