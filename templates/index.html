                                    const timing = document.createElement('div');
                                    timing.className = 'timing-info';
                                    const timeParts = [`${(parsed.total_ms / 1000).toFixed(1)}s total`];
                                    if (parsed.stream_ms) timeParts.push(`${(parsed.stream_ms / 1000).toFixed(1)}s generation`);
                                    if (metadata.classify_ms) timeParts.push(`routed in ${metadata.classify_ms}ms`);
                                    timing.textContent = timeParts.join(' \u00b7 ');
                                    assistantDiv.appendChild(timing);
                                }
                            }

                            await loadConversations();
                            setTimeout(() => loadConversations(), 2500);
                        }

                        // --- Shared: error event ---
                        else if (eventType === 'error') {
                            if (searchingEl) {
                                searchingEl.remove();
                                searchingEl = null;
                            }
                            if (contentDiv) {
                                contentDiv.innerHTML = `<span style="color: var(--danger)">Error: ${escapeHtml(parsed.error)}</span>`;
                            } else {
                                showToast('Error: ' + parsed.error);
                            }
                        }
                    }
                }
            } catch (err) {
                // AbortError is expected when the user clicks "Stop Pipeline"
                if (err.name !== 'AbortError') {
                    showToast('Connection error: ' + err.message);
                }
            } finally {
                isStreaming = false;
                document.getElementById('sendBtn').disabled = false;
                if (searchingEl) searchingEl.remove();
                // Finalize partial content if the pipeline was aborted mid-phase.
                // Without this, the last phase would be stuck showing the streaming
                // indicator with raw markdown instead of rendered content.
                if (currentMode === 'writing' && pipelineContainer) {
                    if (contentDiv && fullContent) {
                        contentDiv.innerHTML = renderMarkdown(fullContent);
                        contentDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                    }
                    const stopBtn = pipelineContainer.querySelector('.writing-stop-btn');
                    if (stopBtn) stopBtn.remove();
                }
                writingAbortController = null;
                pipelineContainer = null;
                currentPhaseDiv = null;
            }
        }

        // =========================================================
        // Input handling
        // =========================================================

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Auto-resize textarea as user types
        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // Mode selector buttons
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('disabled')) {
                    showToast(`${btn.dataset.mode} mode \u2014 coming soon!`);
                    return;
                }
                switchMode(btn.dataset.mode);
            });
        });

        // =========================================================
        // Utilities
        // =========================================================

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (type !== 'info' ? ' ' + type : '');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function timeAgo(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
            return date.toLocaleDateString();
        }

        // =========================================================
        // Settings panel
        // =========================================================

        async function openSettings() {
            const overlay = document.getElementById('settingsOverlay');
            overlay.classList.add('open');

            // Load current settings and available models in parallel
            const [settingsRes, modelsRes] = await Promise.all([
                fetch('/settings'),
                fetch('/models'),
            ]);
            const current = await settingsRes.json();
            const allModels = await modelsRes.json();
            const modelNames = allModels.map(m => m.name || m.model || 'unknown');

            // Populate model dropdowns
            const modelKeys = ['general_model', 'code_model', 'reasoning_model', 'rag_model', 'writer_model', 'editor_model'];
            for (const key of modelKeys) {
                const sel = document.getElementById('set-' + key);
                sel.innerHTML = modelNames.map(n =>
                    `<option value="${escapeHtml(n)}" ${n === current[key] ? 'selected' : ''}>${escapeHtml(n)}</option>`
                ).join('');
            }

            // Set other controls
            document.getElementById('set-search_method').value = current.search_method;
            const searchRange = document.getElementById('set-search_results_count');
            searchRange.value = current.search_results_count;
            searchRange.nextElementSibling.textContent = current.search_results_count;
            const roundsRange = document.getElementById('set-max_writing_rounds');
            roundsRange.value = current.max_writing_rounds;
            roundsRange.nextElementSibling.textContent = current.max_writing_rounds;
            document.getElementById('set-theme').value = current.theme;
        }

        function closeSettings() {
            document.getElementById('settingsOverlay').classList.remove('open');
        }

        async function saveSettings() {
            const updates = {
                general_model: document.getElementById('set-general_model').value,
                code_model: document.getElementById('set-code_model').value,
                reasoning_model: document.getElementById('set-reasoning_model').value,
                rag_model: document.getElementById('set-rag_model').value,
                writer_model: document.getElementById('set-writer_model').value,
                editor_model: document.getElementById('set-editor_model').value,
                search_method: document.getElementById('set-search_method').value,
                search_results_count: parseInt(document.getElementById('set-search_results_count').value),
                max_writing_rounds: parseInt(document.getElementById('set-max_writing_rounds').value),
                theme: document.getElementById('set-theme').value,
            };

            const res = await fetch('/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updates),
            });

            if (res.ok) {
                applyTheme(updates.theme);
                closeSettings();
                showToast('Settings saved', 'success');
            } else {
                const err = await res.json();
                showToast(err.detail || 'Failed to save settings', 'error');
            }
        }

        // Apply the theme to the page. "system" reads the OS preference
        // via the prefers-color-scheme media query, which the browser
        // evaluates in real time. We also listen for OS theme changes so
        // the app switches instantly when you toggle system dark mode.
        function applyTheme(theme) {
            if (theme === 'system') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = prefersDark ? 'dark' : 'light';
            } else {
                document.documentElement.dataset.theme = theme || 'dark';
            }
            // Store the raw setting so the listener knows whether to react
            document.documentElement.dataset.themeSetting = theme || 'dark';
        }

        // Listen for OS dark/light mode changes. Only applies when the
        // theme setting is "system" — if the user picked dark or light
        // explicitly, OS changes are ignored.
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (document.documentElement.dataset.themeSetting === 'system') {
                document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
            }
        });

        // =========================================================
        // Search overlay (Cmd+K)
        // =========================================================

        let searchTimer = null;

        function openSearch() {
            const overlay = document.getElementById('searchOverlay');
            overlay.classList.add('open');
            const input = document.getElementById('searchInput');
            input.value = '';
            input.focus();
            document.getElementById('searchResults').innerHTML =
                '<div class="search-empty">Type to search across all conversations</div>';
        }

        function closeSearch() {
            document.getElementById('searchOverlay').classList.remove('open');
        }

        function debounceSearch(query) {
            clearTimeout(searchTimer);
            if (!query.trim()) {
                document.getElementById('searchResults').innerHTML =
                    '<div class="search-empty">Type to search across all conversations</div>';
                return;
            }
            searchTimer = setTimeout(() => runSearch(query.trim()), 300);
        }

        async function runSearch(query) {
            const res = await fetch(`/conversations/search?q=${encodeURIComponent(query)}`);
            const results = await res.json();
            const container = document.getElementById('searchResults');

            if (results.length === 0) {
                container.innerHTML = '<div class="search-empty">No matches found</div>';
                return;
            }

            const modeIcons = { chat: '\u{1F4AC}', documents: '\u{1F4C4}', writing: '\u270D\uFE0F', vision: '\u{1F441}' };
            container.innerHTML = results.map(r => `
                <div class="search-result" onclick="closeSearch(); loadConversation('${r.id}')">
                    <div class="search-result-title">${modeIcons[r.mode] || ''} ${escapeHtml(r.title)}</div>
                    <div class="search-result-snippet">${escapeHtml(r.snippet)}</div>
                </div>
            `).join('');
        }

        // =========================================================
        // Export
        // =========================================================

        async function exportConversation(id) {
            try {
                const res = await fetch(`/conversations/${id}/export`, { method: 'POST' });
                if (!res.ok) {
                    showToast('Export failed', 'error');
                    return;
                }
                // Get filename from Content-Disposition header or use default
                const disposition = res.headers.get('Content-Disposition') || '';
                const filenameMatch = disposition.match(/filename="(.+?)"/);
                const filename = filenameMatch ? filenameMatch[1] : 'conversation.md';

                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Exported', 'success');
            } catch (e) {
                showToast('Export error: ' + e.message, 'error');
            }
        }

        // =========================================================
        // Mobile sidebar
        // =========================================================

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('mobile-open');
            document.getElementById('sidebarBackdrop').classList.toggle('open');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('mobile-open');
            document.getElementById('sidebarBackdrop').classList.remove('open');
        }

        // =========================================================
        // Keyboard shortcuts
        // =========================================================

        document.addEventListener('keydown', (e) => {
            const mod = navigator.platform.includes('Mac') ? e.metaKey : e.ctrlKey;

            // Escape: close any open panel
            if (e.key === 'Escape') {
                closeSettings();
                closeSearch();
                closeSidebar();
                return;
            }

            // Don't capture shortcuts when typing in an input/textarea
            // (except Cmd+Enter which is a send action)
            const inInput = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);

            if (mod && e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
                return;
            }

            if (!mod) return;

            if (e.key === 'n') {
                e.preventDefault();
                newChat();
            } else if (e.key === ',') {
                e.preventDefault();
                openSettings();
            } else if (e.key === 'k') {
                e.preventDefault();
                openSearch();
            } else if (!inInput && e.key === '1') {
                e.preventDefault();
                switchMode('chat');
            } else if (!inInput && e.key === '2') {
                e.preventDefault();
                switchMode('documents');
            } else if (!inInput && e.key === '3') {
                e.preventDefault();
                switchMode('writing');
            }
        });

        // =========================================================
        // Close panels helper
        // =========================================================

        function closeAllPanels() {
            closeSettings();
            closeSearch();
            closeSidebar();
        }

        // =========================================================
        // Init
        // =========================================================

        // Load theme from settings on page load
        fetch('/settings').then(r => r.json()).then(s => applyTheme(s.theme)).catch(() => {});

        loadConversations();
    </script>
</body>
</html>
